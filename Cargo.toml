[package]
name = "SHARP3"
version = "0.4.0"
edition = "2021"
authors = ["SHARP Protocol Team"]
description = "Swift Hash Assurance Rust Protocol - High-performance file transfer protocol"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
tokio-util = { version = "0.7", features = ["codec", "net", "compat"] }
bytes = "1.5"

# Hashing
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"

# GUI
eframe = { version = "0.24", optional = true }
egui = { version = "0.24", optional = true }
rfd = { version = "0.12", optional = true }

# TLS (optional)
rustls = { version = "0.22", optional = true }
tokio-rustls = { version = "0.25", optional = true }
rustls-pemfile = { version = "2.0", optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command line
clap = { version = "4.4", features = ["derive"] }

# System info
sysinfo = "0.30"

# Path handling
dirs = "5.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Memory mapping for sparse files
memmap2 = "0.9"
crc32fast = "1.3"
hmac = "0.12"
hex = "0.4.0"
x25519-dalek = "2.0"
ring = "0.17.14"


# Core connectivity dependencies (always included when connectivity enabled)
uuid = { version = "1.6", features = ["v4"], optional = true }
rand = { version = "0.8", optional = true }

# WebRTC ICE stack (primary connectivity method)
webrtc = { version = "0.13.0", optional = true }
webrtc-ice = { version = "0.13.0", optional = true }
webrtc-stun = { version = "0.1.13", optional = true }
webrtc-turn = { version = "0.1.3", optional = true }
webrtc-util = { version = "0.11.0", optional = true }

# libp2p fallback system
libp2p = { version = "0.53", features = ["autonat", "identify", "ping", "tcp", "noise", "yamux"], optional = true }
libp2p-swarm = { version = "0.44", optional = true }

# UPnP support (legacy compatibility)
igd = { version = "0.12", features = ["aio"], optional = true }
if-addrs = { version = "0.6", optional = true }
xmltree = { version = "0.10", optional = true }
url = { version = "2.5", optional = true }
futures = { version = "0.3", optional = true }
hyper = { version = "0.14", optional = true, features = ["client", "http1"] }
sha1 = { version = "0.10", optional = true }
md5 = { version = "0.10", package = "md-5", optional = true }
subtle = { version = "2.5", optional = true }
crc = { version = "3.0", optional = true }
reqwest = { version = "0.11", optional = true, features = ["rustls-tls"] }
local-ip-address = { version = "0.5", optional = true }

# Relay encryption system
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

# Additional networking utilities
hickory-resolver = { version = "0.24", optional = true }  # For DNS resolution
socket2 = { version = "0.5", optional = true }           # For advanced socket options

# Configuration and data
toml = { version = "0.8", optional = true }              # For NAT router pools config

# Metrics and monitoring
parking_lot = "0.12"
winapi = { version = "0.3.9", features = ["winbase", "winnt", "winuser", "minwinbase", "minwindef", "ntdef", "iphlpapi", "iptypes"] }

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winbase", "winnt", "winuser", "minwinbase", "minwindef", "ntdef"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.0"
once_cell = "1.21.3"
hostname = "0.4.1"
regex = "1.11.1"
num_cpus = "1.17.0"

[features]
default = ["gui", "connectivity"]

# GUI support
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

# TLS encryption
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
nat-traversal = [
    "dep:igd",
    "dep:if-addrs",
    "dep:xmltree",
    "dep:url",
    "dep:futures",
    "dep:hyper",
    "dep:sha1",
    "dep:md5",
    "dep:subtle",
    "dep:crc",
    "dep:reqwest",
    "dep:local-ip-address",
]

# Full connectivity suite (replaces nat-traversal)
connectivity = [
    "dep:uuid",
    "dep:rand",
    "webrtc-ice-stack",
    "libp2p-fallback",
    "relay-encryption",
    "nat-router-pools",
    "upnp-support"
]

# WebRTC ICE stack (primary method)
webrtc-ice-stack = [
    "dep:webrtc",
    "dep:webrtc-ice",
    "dep:webrtc-stun",
    "dep:webrtc-turn",
    "dep:webrtc-util",
    "dep:hickory-resolver",
    "dep:socket2"
]

# libp2p fallback system
libp2p-fallback = [
    "dep:libp2p",
    "dep:libp2p-swarm"
]

# Relay encryption capabilities
relay-encryption = [
    "dep:aes-gcm",
    "dep:chacha20poly1305",
    "dep:hkdf",
    "dep:sha2"
]

# NAT router pools configuration
nat-router-pools = [
    "dep:toml"
]

# UPnP support (legacy compatibility)
upnp-support = [
    "dep:igd",
    "dep:if-addrs"
]

# Development and testing features
dev-tools = ["dep:hickory-resolver"]

# Minimal build (no connectivity)
minimal = []

[[bin]]
name = "sharp-sender"
path = "src/bin/sender.rs"

[[bin]]
name = "sharp-receiver"
path = "src/bin/receiver.rs"

# Relay server with encryption support
[[bin]]
name = "sharp-relay"
path = "src/bin/relay.rs"

# NAT router pool for testing/development
[[bin]]
name = "sharp-nat-router"
path = "src/bin/nat_router.rs"
required-features = ["connectivity"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Optimizations for connectivity components
[profile.release.package.webrtc]
opt-level = 3
codegen-units = 1

[profile.release.package.libp2p]
opt-level = 3
codegen-units = 1