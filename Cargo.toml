[package]
name = "sharp256"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
authors = ["Echo_Eins"]
license = "MIT"
repository = "https://github.com/echo-eins/sharp256"
description = "SHARP-256: Swift Hash Assurance Rust Protocol - encrypted, reliable, BLAKE3-verified transfer of files and directories over UDP"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Integrity: whole-file hashes, MACs and key derivation
blake3 = { version = "1.5", features = ["mmap", "rayon"] }

# Security: Noise IKpsk2 handshake, AEAD transport, passphrase hardening
snow = { version = "=0.9.6", default-features = false, features = ["default-resolver", "risky-raw-split"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
aes = "0.8"
chacha20poly1305 = { version = "0.10", default-features = false }
chacha20 = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
argon2 = "0.5"
subtle = "2"
zeroize = "1"

# Resume state files
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors and logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI and paths
clap = { version = "4.4", features = ["derive", "env"] }
dirs = "5.0"

# Sockets: buffer sizing, path-MTU related options
socket2 = { version = "0.5", features = ["all"] }
# Batched datagram I/O: GSO/GRO and sendmmsg/recvmmsg on Linux, USO/URO on
# Windows (0.6 needs a newer compiler than our MSRV)
quinn-udp = { version = "0.5.14", default-features = false, features = ["tracing"] }
rand = "0.8"
parking_lot = "0.12"

# GUI (optional)
eframe = { version = "0.24", optional = true }
egui = { version = "0.24", optional = true }
rfd = { version = "0.12", optional = true }

# NAT traversal (optional)
igd = { version = "0.12", features = ["aio"], optional = true }
if-addrs = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# "winuser" is not used by this crate directly: eframe 0.24 imports
# winapi::um::winuser for the window icon without enabling that feature
# itself, so the GUI build on Windows depends on it being enabled here.
winapi = { version = "0.3.9", features = ["fileapi", "ntdef", "winnt", "winsock2", "ws2def", "ws2ipdef", "minwinbase", "winuser"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["gui", "nat-traversal"]
gui = ["dep:eframe", "dep:egui", "dep:rfd"]
nat-traversal = ["dep:igd", "dep:if-addrs"]

[[bin]]
name = "sharp-sender"
path = "src/bin/sender.rs"

[[bin]]
name = "sharp-receiver"
path = "src/bin/receiver.rs"

# Cryptography and hashing in dependencies are painfully slow unoptimised;
# debug builds of this crate stay debuggable while tests run at usable speed.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
