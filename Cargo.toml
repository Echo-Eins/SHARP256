[package]
name = "sharp256"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
authors = ["Echo_Eins"]
license = "MIT"
repository = "https://github.com/echo-eins/sharp256"
description = "SHARP-256: Swift Hash Assurance Rust Protocol - encrypted, reliable, BLAKE3-verified transfer of files and directories over UDP"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }
# CancellationToken only, which needs none of its features
tokio-util = "0.7"
# Received names in one Unicode form (NFC): macOS hands its own over
# decomposed, and the same name in two forms is two files elsewhere
unicode-normalization = "0.1.24"

# Integrity: whole-file hashes, MACs and key derivation
blake3 = { version = "1.5", features = ["mmap", "rayon", "zeroize"] }

# Security: the Noise IKpsk2 handshake (written out in `crypto::noise` on
# these primitives), AEAD transport, passphrase hardening.
#
# Every crate below that holds key material is built with its `zeroize`
# feature, so that it wipes the key (AES round keys, the GHASH and Poly1305
# keys, the ChaCha20 state, Argon2's memory blocks) when it is dropped;
# without it they stay in freed memory. ghash, polyval and poly1305 are
# not used directly: they are named only to switch that feature on inside
# aes-gcm and chacha20poly1305. `crypto::tests` checks at compile time that
# the types keys are kept in do wipe themselves.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }
poly1305 = { version = "0.8", features = ["zeroize"] }
chacha20 = { version = "0.9", features = ["zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
subtle = "2"
zeroize = "1"

# Resume state files
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors and logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
# Without env-filter, whose regular expressions a level or a list of
# `target=level` does not need (`init_logging` reads both with `Targets`),
# and without tracing-log, which nothing but the GUI's libraries log through
# (the `gui` feature switches it on).
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "ansi", "smallvec", "std"] }

# CLI and paths
# Without colour in --help and in error messages, which takes six crates.
clap = { version = "4.4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
dirs = "5.0"
# Asking for the identity file's passphrase on the terminal without echo
rpassword = "7"

# Sockets: buffer sizing, path-MTU related options
socket2 = { version = "0.5", features = ["all"] }
# Batched datagram I/O: GSO/GRO and sendmmsg/recvmmsg on Linux, USO/URO on
# Windows (0.6 needs a newer compiler than our MSRV)
quinn-udp = { version = "0.5.14", default-features = false, features = ["tracing"] }
# The system's random source only (OsRng): without `std_rng`, whose
# ChaCha generator for thread_rng takes three crates. Tests have it all.
rand = { version = "0.8.6", default-features = false, features = ["getrandom", "alloc"] }
parking_lot = "0.12"

# GUI (optional). It needs Rust 1.85 (egui 0.32, and webbrowser 1.2.2,
# whose Unix BROWSER handling is fixed: RUSTSEC-2026-0257); everything else
# 1.82, the rust-version above. File dialogs through the desktop portal
# (rfd 0.15), with no GTK to link.
eframe = { version = "0.32", optional = true }
egui = { version = "0.32", optional = true }
rfd = { version = "0.15", optional = true }

# NAT traversal (optional)
if-addrs = { version = "0.6", optional = true }
# TURN long-term credentials (RFC 8489 section 9.2): the key is an MD5 of
# the user's name, the realm and the password, and every request carries
# an HMAC-SHA1 over itself. Nothing here protects data: transfers are sealed
# end to end, and this only proves to a TURN server who is asking.
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
# TLS 1.3 to a relay (`relay::tls`), for networks that let little but
# HTTPS out: rustls on ring, TLS 1.3 alone, without logging. A transfer is
# sealed end to end inside it as always; TLS is a way through, and the
# relay's long-term key, bound to the TLS session, shows whether anything on
# the way opened it. ring also makes the relay's TLS key and signs the
# certificate it presents (`relay::tls::certificate`).
rustls = { version = "0.23.20", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
ring = { version = "0.17", optional = true }
# ML-KEM-768 (FIPS 203) for protocol version 4's hybrid key exchange. The
# 0.2 series: 0.3 needs Rust 1.85, above this crate's 1.82.
ml-kem = { version = "0.2.1", default-features = false, features = ["zeroize"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Keychain, where a protected identity file's key is kept on macOS
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["fileapi", "ntdef", "winnt", "winsock2", "ws2def", "ws2ipdef", "ws2tcpip", "netioapi", "inaddr", "in6addr", "minwinbase", "winbase", "memoryapi", "sysinfoapi", "processthreadsapi", "winerror", "dpapi", "wincrypt"] }

[dev-dependencies]
tempfile = "3"
rand = "0.8.6"
# The implementations `crypto::noise` and `crypto::blake2s` are checked
# against (the Noise handshake used to be snow's; no version of snow wipes
# its keys). Test builds only.
snow = { version = "=0.9.6", default-features = false, features = ["default-resolver", "risky-raw-split"] }
blake2 = "0.10"
# ML-KEM's deterministic key generation and encapsulation, and SHAKE-128,
# for C2SP CCTV's accumulated vectors (`crypto::kem`). Test builds only.
ml-kem = { version = "0.2.1", default-features = false, features = ["zeroize", "deterministic"] }
sha3 = "0.10"

# Model checking of the synchronisations that hold invariants (scripts/loom.sh):
# only in builds with --cfg sharp_loom.
[target.'cfg(sharp_loom)'.dev-dependencies]
loom = "0.7"

[features]
default = ["gui", "nat-traversal", "tls"]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "tracing-subscriber/tracing-log"]
nat-traversal = ["dep:if-addrs", "dep:md-5", "dep:sha1", "dep:hmac"]
# TLS 1.3 to relays (`relay::tls`). Apart from NAT traversal because ring,
# under rustls, compiles C for its target: the sanitizers would not see
# into it, and a check for macOS from Linux cannot build it.
tls = ["nat-traversal", "dep:rustls", "dep:tokio-rustls", "dep:ring"]

[[bin]]
name = "sharp-sender"
path = "src/bin/sender.rs"

[[bin]]
name = "sharp-receiver"
path = "src/bin/receiver.rs"

[[bin]]
name = "sharp-relay"
path = "src/bin/relay.rs"
required-features = ["nat-traversal"]

[[bin]]
name = "sharp-probe"
path = "src/bin/probe.rs"
required-features = ["nat-traversal"]

# Cryptography and hashing in dependencies are painfully slow unoptimised;
# debug builds of this crate stay debuggable while tests run at usable speed.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# `cargo fuzz` builds with --cfg fuzzing (see fuzz/), scripts/loom.sh with
# --cfg sharp_loom.
#
# Unsafe code only where it is allowed by name (`#[allow(unsafe_code)]`, all
# of it calls into the system; docs/UNSAFE.md lists each), every block with
# the reason it is sound, and one operation to a block.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(sharp_loom)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
