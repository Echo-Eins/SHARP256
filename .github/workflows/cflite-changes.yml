# Fuzzing a change, on ClusterFuzzLite: every push and pull request builds
# the fuzz targets with AddressSanitizer and fuzzes them for ten minutes
# between them, from the corpus the batch runs keep (cflite-batch.yml). A
# crash fails the check and is kept as an artifact. docs/FUZZING.md says
# what runs where. Actions are pinned by commit.
name: Fuzzing, changes

on:
  push:
  pull_request:
  workflow_dispatch:

# Reading the corpus other runs left takes the Actions API.
permissions:
  contents: read
  actions: read

jobs:
  fuzz:
    name: Fuzzing the change
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build (AddressSanitizer)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Fuzz
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: address
          parallel-fuzzing: true
