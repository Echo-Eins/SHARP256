# Every check a change has to pass, on every push and pull request.
#
# The tests run on Linux, macOS and Windows with IPv6 required
# (SHARP_REQUIRE_IPV6): an IPv6 test that cannot run fails instead of
# skipping, so a runner without IPv6 cannot make them pass by not running
# them.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
      - name: GTK (the GUI's file dialogs link against it on Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - run: cargo fmt --check
      - name: Clippy, every feature set
        run: |
          cargo clippy --all-features --all-targets -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings
          cargo clippy --no-default-features --features nat-traversal --all-targets -- -D warnings
      - name: Library documentation, broken links included
        # The binaries' doc comments are their --help text, written for a
        # terminal rather than for rustdoc; the library's are documentation.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --lib
      - name: Clippy for FreeBSD (socket options differ there)
        run: |
          rustup target add x86_64-unknown-freebsd
          cargo clippy --target x86_64-unknown-freebsd --no-default-features --features nat-traversal,blake3/pure --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SHARP_REQUIRE_IPV6: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: GTK (the GUI's file dialogs link against it on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - name: What this runner has
        shell: bash
        run: |
          rustc --version
          if command -v ip >/dev/null; then ip -6 addr; elif command -v ifconfig >/dev/null; then ifconfig | grep inet6 || true; else ipconfig | grep -i ipv6 || true; fi
      - name: Unit tests
        run: cargo test --all-features --lib
      - name: End-to-end tests
        run: cargo test --all-features --test e2e
      - name: Everything else (binaries, docs)
        run: |
          cargo test --all-features --bins
          cargo test --all-features --doc

  msrv:
    name: Minimum supported Rust (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.82 --profile minimal && rustup default 1.82
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ hashFiles('Cargo.lock') }}
      - name: GTK (the GUI's file dialogs link against it on Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - run: cargo check --all-features --all-targets
      - run: cargo test --all-features --lib

  netns:
    name: Network namespace tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: netns-${{ hashFiles('Cargo.lock') }}
      - name: GTK (the GUI's file dialogs link against it on Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor by default.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: sh scripts/netns-tests.sh

  natlab:
    # The NAT laboratory: real translation and filtering in the kernel
    # (network namespaces, conntrack, nftables), against independent
    # implementations — miniupnpd for PCP, NAT-PMP and UPnP, coturn for TURN,
    # a script for a DHT node. Each job is one claim of docs/NAT.md; a claim
    # that stops holding fails here. The IPv6 parts run on the runner's own
    # kernel, which has IPv6.
    name: NAT laboratory (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NAT kinds checked by the oracle
            run: python3 scripts/natlab/natlab.py oracle
          - name: every pair through a relay that carries
            run: python3 scripts/natlab/natlab.py matrix -v
          - name: ... and a long transfer moves off the relay
            run: NATLAB_SIZE_MB=30 NATLAB_MAX_RATE=20M python3 scripts/natlab/natlab.py matrix --timeout 90 -v
          - name: every pair through a relay that only introduces
            run: python3 scripts/natlab/natlab.py matrix --direct-only -v
          - name: every pair by contact cards, no relay
            run: python3 scripts/natlab/natlab.py matrix --via card -v
          - name: every pair through a TURN server
            run: NATLAB_SIZE_MB=30 NATLAB_MAX_RATE=20M python3 scripts/natlab/natlab.py matrix --via turn --timeout 90 -v
          - name: every pair through the DHT alone
            run: python3 scripts/natlab/natlab.py matrix --via dht --timeout 60 -v
          - name: every pair by addresses typed in, no cards
            run: python3 scripts/natlab/natlab.py matrix --via addr --timeout 60 -v
          - name: networks that cannot reach each other, relay
            run: python3 scripts/natlab/natlab.py matrix --isolate -v
          - name: networks that cannot reach each other, TURN
            run: NATLAB_SIZE_MB=20 python3 scripts/natlab/natlab.py matrix --via turn --isolate --timeout 60 -v
          - name: port forwards (PCP, NAT-PMP, UPnP), and a carrier's PCP
            run: |
              python3 scripts/natlab/natlab.py portmap
              python3 scripts/natlab/natlab.py portmap --anycast
          - name: IPv6 firewalls, and both families at once
            run: python3 scripts/natlab/natlab.py v6 --direct-only -v
          - name: IPv6 pinholes
            run: python3 scripts/natlab/natlab.py portmap6
          - name: IPv6 through a relay, by cards, by typed addresses, through the DHT
            run: |
              python3 scripts/natlab/natlab.py v6 -v
              python3 scripts/natlab/natlab.py v6 --via card -v
              python3 scripts/natlab/natlab.py v6 --via addr --timeout 60 -v
              python3 scripts/natlab/natlab.py v6 --via dht --timeout 60 -v
          - name: IPv6 through TURN, and networks that cannot reach each other
            run: |
              NATLAB_SIZE_MB=30 NATLAB_MAX_RATE=20M python3 scripts/natlab/natlab.py v6 --via turn --timeout 90 -v
              python3 scripts/natlab/natlab.py v6 --isolate -v
              NATLAB_SIZE_MB=20 python3 scripts/natlab/natlab.py v6 --via turn --isolate --timeout 60 -v
          - name: sharp-probe says what a transfer does, for every pair
            run: python3 scripts/natlab/natlab.py probe --all --wait 12
          - name: sharp-probe with addresses typed in, and over IPv6
            run: |
              python3 scripts/natlab/natlab.py probe --all --addr --wait 45
              python3 scripts/natlab/natlab.py probe --v6 --wait 12
              python3 scripts/natlab/natlab.py probe --v6 --addr --wait 45
          - name: a sender that starts before its receiver
            run: python3 scripts/natlab/natlab.py early
          - name: a direct path that dies, and the way back to the server
            run: python3 scripts/natlab/natlab.py fallback
          - name: a carrier-grade NAT in front of the router
            run: python3 scripts/natlab/natlab.py cgn -v
          - name: local network (IPv4 and IPv6), one NAT, forgetful NAT
            run: |
              python3 scripts/natlab/natlab.py lan
              python3 scripts/natlab/natlab.py lan --v6
              python3 scripts/natlab/natlab.py samenat
              python3 scripts/natlab/natlab.py timeout
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: natlab-${{ hashFiles('Cargo.lock') }}
      - name: The routers' and the TURN server's own software
        run: |
          # Installing a daemon starts it; these are started by the laboratory
          # in namespaces of its own.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 conntrack miniupnpd miniupnpd-nftables coturn python3
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor by default.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build (no GUI)
        run: cargo build --release --no-default-features --features nat-traversal --bins
      - name: ${{ matrix.name }}
        env:
          SHARP_BIN_DIR: ${{ github.workspace }}/target/release
        run: ${{ matrix.run }}

  fuzz:
    name: Fuzzing (short run of every target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - name: Run every target for a minute
        working-directory: fuzz
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
