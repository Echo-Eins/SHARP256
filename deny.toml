# cargo-deny: what the dependency graph may contain. scripts/supply-chain.sh
# runs it twice, and CI with it, on every change and every day (advisories
# are published without a change here):
#
#   cargo deny check                    every check, the default features
#                                       (all of them), every target
#   cargo deny --no-default-features --features nat-traversal check bans
#                                       duplicates in the build without the GUI
#
# Every exception names the crate it is for and why. All but two are the
# GUI's (egui 0.32, rfd 0.15).

[advisories]
# Vulnerabilities, unsound code, unmaintained and yanked crates are all
# errors, in every crate of the graph (unsound code is checked only in the
# crates named in Cargo.toml by default: memmap2 under blake3 had some),
# except some of egui's own dependencies, which have no fixed version it
# can take:
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained (epaint's font rendering, through ab_glyph): reads only the fonts built into the GUI" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.36 (zbus_xml under zbus-lockstep, under atspi-common): parses AT-SPI's own interface files, in atspi-common's tests only; nothing is parsed at run time. The zbus_xml without it needs Rust 1.87" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.36, as RUSTSEC-2026-0194" },
]

[licenses]
# Licenses that let the MIT-licensed binaries be shipped as they are.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    # Weak copyleft by file (dirs' `option-ext`), the files unchanged and
    # their source public on crates.io.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # The fonts built into the GUI.
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
# Two versions of one crate: twice the code to trust.
multiple-versions = "deny"
wildcards = "deny"
skip-tree = [
    # egui 0.32's graph has some twenty (two generations of rand, syn,
    # thiserror, bitflags and objc2 among them); skipping it skips every
    # version it uses anywhere, which is why the build without the GUI is
    # checked on its own as well.
    { crate = "eframe", reason = "egui 0.32's dependency graph" },
    # The GUI's file dialogs through the desktop portal: rand 0.9 beside
    # this crate's 0.8.
    { crate = "rfd", reason = "the GUI's file dialogs (ashpd)" },
    # Generated bindings to the Windows API, without code of their own; the
    # crates that need them move to newer ones at their own pace.
    { crate = "windows-sys", reason = "generated Windows API bindings" },
]

[sources]
# crates.io only: no git dependencies, no other registry.
unknown-registry = "deny"
unknown-git = "deny"
